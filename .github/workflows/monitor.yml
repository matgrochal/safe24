name: Monitor sklep.technica.pl

on:
  schedule:
    # Nierówne minuty zamiast */10 — GitHub uruchamia najwięcej zadań o pełnych
    # dziesiątkach (:00, :10, :20), więc kolejka jest wtedy najdłuższa.
    # Przesunięcie o 3 minuty realnie skraca oczekiwanie.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:          # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write             # potrzebne do zapisania state/ z powrotem do repo

concurrency:
  group: technica-monitor     # nigdy dwa biegi naraz
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt

      - name: Monitoruj sklep przez ~25 minut
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TEAMS_PAYLOAD: adaptive
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
          SMSAPI_TOKEN: ${{ secrets.SMSAPI_TOKEN }}
          SMSAPI_TO: ${{ secrets.SMSAPI_TO }}
          SMSAPI_FROM: ${{ secrets.SMSAPI_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Pętla jest dłuższa niż odstęp crona celowo. Kolejne uruchomienia czekają
        # w kolejce (concurrency) i startują od razu po zakończeniu poprzedniego,
        # więc monitoring działa niemal bez przerw nawet gdy GitHub się spóźnia.
        run: python monitor.py --loop-minutes 25 --pass-seconds 60

      - name: Zapisz stan (hash, migawki, historia awarii)
        if: always()
        run: |
          set -e
          BRANCH="${{ github.ref_name }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state/snapshots

          # Bez rebase. Stan monitora z tego biegu jest zawsze najnowszy, więc nie
          # ma czego scalać — wystarczy postawić go na aktualnym stanie zdalnym.
          # Rebase powodował konflikt w state/state.json, gdy inny bieg zdążył
          # wypchnąć swoją wersję tego samego pliku.
          for attempt in 1 2 3; do
            git fetch --quiet origin "$BRANCH"
            git reset --mixed --quiet "origin/$BRANCH"
            git add state
            if git diff --staged --quiet; then
              echo "Brak zmian w stanie — nic do zapisania."
              exit 0
            fi
            git commit --quiet -m "chore(monitor): aktualizacja stanu [skip ci]"
            if git push --quiet origin "HEAD:$BRANCH"; then
              echo "Stan zapisany (próba $attempt)."
              exit 0
            fi
            echo "Repozytorium zmieniło się w międzyczasie — ponawiam (próba $attempt)."
            sleep 5
          done
          echo "Nie udało się zapisać stanu po 3 próbach."
          exit 1
